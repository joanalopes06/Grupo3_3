<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Flask demo PCII</title>
    {% block title %}
    {% endblock %}
    
    <style>
      .button {
        background-color: lightblue;
        color: white;
        padding: 10px 15px;
        border: none;
        border-radius: 5px;
        text-decoration: none;
      }

      .button:hover {
        background-color: lightblue;
      }
    </style>
  </head>
  <body>
    <nav>
      <ul class="menu">
        {% if ulogin == None %}
          <li><a class="button" href="/login">Login</a></li>
        {% else %}
          <li><a class="button" href="/logoff">Logoff</a></li>
          <li><a class="button" href="/Player">Player</a></li>
          <li><a class="button" href="/gform/Game">Game</a></li>
          <li><a class="button" href="/gform/Tournament">Tournament</a></li>
          <li><a class="button" href="/gform/Game_player">Game_player</a></li>
          <li><a class="button" href="/plotly">Plotly</a></li>
          <li><a class="button" href="/Userlogin">Users</a></li>
          <li><a class="button" >User: {{ulogin}}</a></li>
        {% endif %}
      </ul>
    </nav>
    {% block content %}
    {% endblock %}
  </body>
</html>
